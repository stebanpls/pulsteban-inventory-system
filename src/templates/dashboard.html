<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Enlace a nuestra hoja de estilos personalizada -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  </head>
  <body>
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-4">Dashboard del Sistema</h2>
        <a href="{{ url_for('index') }}" class="btn btn-outline-light"
          >← Volver al Inicio</a
        >
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="card bg-secondary">
            <div class="card-body">
              <h5 class="card-title">Usuarios por Rol</h5>
              <!-- Almacenamos los datos en atributos HTMLdata- -->
              <canvas 
                id="usersByRoleChart" 
                data-labels="{{ chart_labels | tojson | forceescape }}"
                data-values="{{ chart_data | tojson | forceescape }}">
              </canvas>
            </div>
          </div>
        </div>
      </div>

    <!-- Incluimos Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const canvas = document.getElementById("usersByRoleChart");

        if (canvas) {
          // Leemos los atributos data-* desde el elemento HTML de forma limpia y estándar
          const labels = JSON.parse(canvas.getAttribute("data-labels") || "[]");
          const dataValues = JSON.parse(canvas.getAttribute("data-values") || "[]");

          new Chart(canvas, {
            type: "bar",
            data: {
              labels: labels,
              datasets: [
                {
                  label: "Número de Usuarios",
                  data: dataValues,
                  backgroundColor: [
                    "rgba(54, 162, 235, 0.6)",
                    "rgba(255, 206, 86, 0.6)",
                    "rgba(75, 192, 192, 0.6)",
                    "rgba(153, 102, 255, 0.6)"
                  ],
                  borderColor: [
                    "rgba(54, 162, 235, 1)",
                    "rgba(255, 206, 86, 1)",
                    "rgba(75, 192, 192, 1)",
                    "rgba(153, 102, 255, 1)"
                  ],
                  borderWidth: 1
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  labels: {
                    color: '#ffffff' // Texto de la leyenda en blanco
                  }
                }
              },
              scales: {
                x: {
                  ticks: {
                    color: '#ffffff' // Nombres de las columnas en blanco
                  },
                  grid: {
                    color: 'rgba(255, 255, 255, 0.1)' // Líneas de cuadrícula sutiles
                  }
                },
                y: {
                  beginAtZero: true,
                  ticks: {
                    stepSize: 1,
                    color: '#ffffff' // Números del eje Y en blanco
                  },
                  grid: {
                    color: 'rgba(255, 255, 255, 0.1)'
                  }
                }
              }
            }
          });
        }
      });
    </script>
  </body>
</html>
